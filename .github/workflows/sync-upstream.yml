name: Sync HDHive/Dian115 Checkin

# 每天 UTC 16:00（北京时间 00:00）从上游同步签到客户端代码；
# 同步后先校验上游签到契约，通过且有变化时自动提升补丁版本、推送并重建 Release，
# 保证插件市场安装到最新代码；契约被破坏时直接失败，等待人工适配后再发布。
on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: 同步上游并发布
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch upstream MoviePilot-Plugins
        run: |
          rm -rf /tmp/MoviePilot-Plugins
          git clone --depth 1 https://github.com/odomu/MoviePilot-Plugins.git /tmp/MoviePilot-Plugins

      - name: Sync HDHive / Dian115 client files
        run: python scripts/sync-upstream.py /tmp/MoviePilot-Plugins

      # 上游一旦重构 checkin/构造参数，这里会直接失败并给出适配提示，
      # 避免把无法签到的客户端代码自动发布出去。
      - name: Verify upstream checkin contract
        run: python scripts/check-client-contract.py

      - name: Check plugin conventions
        run: python scripts/check-plugin.py

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- plugins.v2; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump plugin version
        if: steps.changes.outputs.changed == 'true'
        run: python scripts/bump-version.py --message "同步上游 HDHive/Dian115 客户端代码"

      - name: Build release archives
        if: steps.changes.outputs.changed == 'true'
        run: python scripts/build-release.py --out dist

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync HDHive/Dian115 checkin from upstream"
          git push

      - name: Publish GitHub Release
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-release.py --dist dist
